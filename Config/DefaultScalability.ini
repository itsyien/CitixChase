; Conservative startup tiers for a dynamic, Lumen-lit city.
; Manual presets remain available when real match performance differs.
[ScalabilitySettings]
PerfIndexThresholds_ViewDistanceQuality="CPU 60 100 160"
PerfIndexThresholds_ShadowQuality="GPU 90 180 300"

; Extremely slow PC tier. Higher presets keep the engine defaults.
[ViewDistanceQuality@0]
r.ViewDistanceScale=0.15

[FoliageQuality@0]
foliage.DensityScale=1
foliage.CullDistanceScale=1
grass.DensityScale=0

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.AmbientOcclusionLevels=0
r.Tonemapper.Quality=0

[ShadowQuality@0]
r.ShadowQuality=0

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=0

[FoliageQuality@1]
foliage.CullDistanceScale=1

[FoliageQuality@2]
foliage.CullDistanceScale=1

[FoliageQuality@3]
foliage.CullDistanceScale=1

[FoliageQuality@Cine]
foliage.CullDistanceScale=1

